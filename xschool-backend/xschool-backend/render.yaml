# Render Blueprint — deploie l'API + PostgreSQL + le front statique.
#
# Place ce fichier a la RACINE de ton repo GitHub.
# Structure de repo attendue (monorepo) :
#   /render.yaml
#   /xschool-backend/   (ce dossier)
#   /xschool-frontend/  (le dossier du front)
#
# Si tu n'as QUE le backend dans le repo, mets ce fichier a la racine du backend
# et retire 'rootDir: xschool-backend' + le service 'xschool-front'.

databases:
  - name: xschool-db
    plan: free
    databaseName: xschool
    user: xschool

services:
  # --- API Flask ---
  - type: web
    name: xschool-api
    runtime: python
    plan: free
    rootDir: xschool-backend
    buildCommand: pip install -r requirements.txt
    # Cree le schema : migrations si presentes, sinon create-tables (idempotent)
    preDeployCommand: "sh -c 'if ls migrations/versions/*.py >/dev/null 2>&1; then flask db upgrade; else flask create-tables; fi'"
    startCommand: gunicorn wsgi:app
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: xschool-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FLASK_APP
        value: wsgi.py
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.12.5"
      # A ADAPTER apres le 1er deploy du front : mets l'URL exacte du site statique
      # (ex: https://xschool-front.onrender.com). '*' fonctionne mais est permissif.
      - key: CORS_ORIGINS
        value: "*"

  # --- Front statique (HTML/CSS/JS) ---
  - type: web
    name: xschool-front
    runtime: static
    rootDir: xschool-frontend
    buildCommand: ""
    staticPublishPath: .
    # Laisse les routes inconnues retomber sur index.html (SPA single-page)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
